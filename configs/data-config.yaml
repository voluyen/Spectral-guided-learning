# Phase 2: data preparation
dataset_name: nvidia/AceReason-1.1-SFT
dataset_split: train
category_filter: math          # AceReason has math + code; paper samples math problems
n_samples: 2000
seed: 42
max_tokens: 16384              # cutoff (paper uses 32k; reduced for 1x 40-48GB GPU)
# Steps are split at logical boundaries: r'([.?!\}\]])([\s\n]+)([A-Z])'. No merging.
tokenizer: Qwen/Qwen3-1.7B-Base
output_path: data/train-2k-segmented.jsonl

# Phase 4: step selection
energy_threshold_p: 0.95       # paper value (Eq. 8) — fixed, not a tuned parameter
