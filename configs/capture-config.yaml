# Phase 3: gradient capture + spectral analysis
model_name: Qwen/Qwen3-1.7B-Base
data_path: data/train-2k-segmented.jsonl
output_dir: data/spectral
strengths_path: data/spectral-strengths.parquet
energy_cutoff: 0.95            # cumulative energy threshold for k* (paper Fig 2 dashed line)
chunk_size: 1024               # positions per chunk when materializing (chunk x vocab) probs
dtype: bfloat16                # model forward dtype; gradients/SVD computed in float32
device: cuda                   # set to cpu for local smoke tests
attn_implementation: sdpa      # flash_attention_2 on server if available
