# Phase 5: Spectral-guided Learning (supervises only high-spectral-strength steps)
# Identical to train-vanilla.yaml except data_path/output_dir — the mask is the only variable.
model_name: Qwen/Qwen3-1.7B-Base
data_path: data/train-spectral.jsonl
output_dir: checkpoints/spectral

epochs: 6
learning_rate: 5.0e-5
min_learning_rate: 1.0e-5
warmup_ratio: 0.1
per_device_batch_size: 1
gradient_accumulation_steps: 32
attn_implementation: sdpa
seed: 42
logging_steps: 5
