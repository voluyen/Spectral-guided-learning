# Phase 3 causal probe (step-diversity experiment). Forced-answer sufficiency curve:
# keep top-p% steps by each metric, let the student answer, measure accuracy vs token budget.
model_name: Qwen/Qwen3-1.7B-Base
data_path: data/train-2k-segmented.jsonl
scores_path: data/spectral-strengths-diversity.parquet
baseline_scores_path: data/baseline-step-scores.parquet   # optional; from `baseline-scores` stage

max_model_len: 32768        # Qwen3-1.7B max_position_embeddings (data cutoff is 16k, so ample)
gpu_memory_utilization: 0.85  # leave headroom on the 44GB L40S
temperature: 0.6
top_p: 0.95
n_samples: 4                # forced-answer completions per prompt, accuracy averaged
max_answer_tokens: 24       # only the boxed answer is generated
seed: 42

budgets: [0.2, 0.4, 0.6, 0.8]           # fraction of TOKENS kept (equalized across metrics)
# qd = strength*novelty (quality-diversity). entropy/ppl/logprob need the baseline-scores stage;
# all metrics keep the highest-scoring steps (high entropy/ppl = informative; high logprob = LALP).
metrics: [strength, novelty, qd, diversity, entropy, ppl, logprob, random]
limit: 80                   # candidate samples scanned before headroom filtering
full_threshold: 0.75        # keep sample only if full-CoT accuracy >= this (solvable)
empty_threshold: 0.25       # ...and empty-CoT accuracy <= this (has headroom)
out_path: results/probe/causal-probe.json
